<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Website of Sandipan</title>
    <link rel="stylesheet" href="chessboard-1.0.0.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Left Panel: Chessboard & Probabilities -->
        <div class="board-container">
            <div id="eval-container">
                <div id="eval-bar">
                    <div id="eval-fill"></div>
                </div>
                <div class="eval-labels">
                    <span id="win-prob-white">White: 50.0%</span>
                    <span id="win-prob-black">Black: 50.0%</span>
                </div>
            </div>

            <div class="board-panel">
                <div id="board" style="width: 500px"></div>
                <!-- SVG overlay for arrows -->
                <svg id="arrow-svg" width="500" height="500"></svg>
            </div>
        </div>

        <!-- Right Panel: Controls -->
        <div class="control-panel">
            <div id="game-setup-page">
                <h1>Chess Website of Sandipan</h1>
                
                <a href="developer.html" class="dev-link-btn" target="_blank">About the Developer</a>
                
                <div class="settings" style="margin-top: 15px;">
                    <label>Play as:</label>
                    <select id="player-color">
                        <option value="w" selected>White</option>
                        <option value="b">Black</option>
                    </select>

                    <label>Opponent ELO (100 - 3500):</label>
                    <input type="number" id="elo" value="1200" min="100" max="3500">
                    
                    <label>Assistance Mode:</label>
                    <select id="assistance">
                        <option value="on">Play with assistance</option>
                        <option value="off" selected>Play without assistance</option>
                    </select>

                    <button id="start-btn">Start Game</button>
                    
                    <div class="action-buttons">
                        <button id="resign-btn" class="btn-resign" disabled>Resign</button>
                        <button id="draw-btn" class="btn-draw" disabled>Offer Draw</button>
                    </div>

                    <button id="review-btn" disabled>Match Review</button>
                </div>

                <div id="status" style="margin-top: 15px;">Status: Waiting to start...</div>
            </div>
        </div>
    </div>

    <script src="jquery-3.5.1.js"></script>
    <script src="chessboard-1.0.0.js"></script>
    <script src="chess.js"></script>
    <script src="script.js"></script>
</body>
</html>
