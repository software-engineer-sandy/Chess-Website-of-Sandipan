<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Website of Sandipan</title>
    <!-- Local Chessboard.js CSS -->
    <link rel="stylesheet" href="chessboard-1.0.0.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Left Panel: Chessboard & Probabilities -->
        <div class="board-container">
            <!-- Win Probability Bar -->
            <div id="eval-container">
                <div id="eval-bar">
                    <div id="eval-fill"></div>
                </div>
                <div class="eval-labels">
                    <span id="win-prob-white">White: 50.0%</span>
                    <span id="win-prob-black">Black: 50.0%</span>
                </div>
            </div>

            <div class="board-panel">
                <div id="board" style="width: 500px"></div>
                <!-- SVG overlay for arrows -->
                <svg id="arrow-svg" width="500" height="500"></svg>
            </div>
        </div>

        <!-- Right Panel: Controls & Review -->
        <div class="control-panel">
            
            <!-- Default Game UI -->
            <div id="game-setup-page">
                <h1>Chess Website of Sandipan</h1>
                
                <!-- Creator Info Section -->
                <div class="creator-info" style="margin-top: 15px;">
                    <div class="creator-profile">
                 
                        <div class="creator-text">
                            <p>Created and maintained by <strong>Sandipan Chowdhury</strong>.</p>
                            <p style="margin-top: 8px; font-weight: bold;">Contact Details:</p>
                            <ul>
                                <li><a href="https://facebook.com/profile.php?id=61572271322559" target="_blank">Facebook</a></li>
                                <li><a href="https://linkedin.com/in/sandipan-chowdhury-463636403" target="_blank">LinkedIn</a></li>
                                <li><a href="https://instagram.com/legend_sandy_789" target="_blank">Instagram</a></li>
                                <li><a href="https://youtube.com/@lgnd-sndy-plays-games" target="_blank">My YT Channel</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
                
                <div class="settings" style="margin-top: 15px;">
                    <label>Play as:</label>
                    <select id="player-color">
                        <option value="w" selected>White</option>
                        <option value="b">Black</option>
                    </select>

                    <label>Opponent ELO (100 - 3500):</label>
                    <input type="number" id="elo" value="1200" min="100" max="3500">
                    
                    <label>Assistance Mode:</label>
                    <select id="assistance">
                        <option value="on">Play with assistance</option>
                        <option value="off" selected>Play without assistance</option>
                    </select>

                    <button id="start-btn">Start Game</button>
                    <button id="review-btn" disabled>Match Review</button>
                </div>

                <div id="status" style="margin-top: 15px;">Status: Waiting to start...</div>
            </div>

            <!-- Match Review Webpage/View -->
            <div id="review-play-page" class="hidden">
                <h1>Match Review</h1>
                
                <div id="review-loading">
                    <p style="text-align:center; margin-top: 40px; font-size: 18px;">
                        Analyzing match...<br>This may take a moment.
                    </p>
                </div>

                <div id="review-play-content" class="hidden">
                    <div class="review-stats stats">
                        <!-- Stat block injected here -->
                    </div>

                    <div class="review-move-card">
                        <span id="review-move-badge" class="badge"></span>
                        <h2 id="review-move-title">Move Name</h2>
                        <p id="review-move-desc">Explanation goes here.</p>
                    </div>

                    <div class="review-nav-buttons">
                        <button id="btn-prev-move">Previous Move</button>
                        <button id="btn-next-move">Next Move</button>
                    </div>
                    
                    <button id="btn-exit-review" style="width: 100%; margin-top: 20px; background-color: #fa412d;">Exit Review</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Local Scripts -->
    <script src="jquery-3.5.1.js"></script>
    <script src="chessboard-1.0.0.js"></script>
    <script src="chess.js"></script>
    
    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
